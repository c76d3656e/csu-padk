name: Rust Server

# 出「拉起来就能对外服务」的单文件服务端：push tag 触发，
# 两个平台各编一份，追加到同一个 release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            out: padk-linux-x64
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            out: padk-windows-x64.exe
            musl: false
    runs-on: ${{ matrix.os }}
    name: build / ${{ matrix.out }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # musl 目标要 C 编译器（ureq 的 TLS 栈里有 ring）
      - name: 安装 musl 工具链
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust

      # dist/ 会被 build.rs 用 include_bytes! 编进二进制，顺序不能反
      - name: 构建前端
        run: |
          npm ci
          npm run build

      - name: 编译服务端
        working-directory: rust
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: 收集产物
        shell: bash
        run: |
          SRC="rust/target/${{ matrix.target }}/release"
          if [ "${{ matrix.musl }}" = "true" ]; then
            cp "$SRC/padk" "${{ matrix.out }}"
            chmod +x "${{ matrix.out }}"
            file "${{ matrix.out }}"
          else
            cp "$SRC/padk.exe" "${{ matrix.out }}"
          fi
          ls -lh "${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -lh out

      # append_body：同一 tag 下别的 job 追加附件时也不覆盖这段说明
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 平安打卡 ${{ github.ref_name }}
          draft: false
          append_body: true
          body: |
            ### 单文件服务端（Rust，无需 Node）

            - `padk-windows-x64.exe` / `padk-linux-x64`：前端已内嵌，多线程，默认监听 `0.0.0.0:5173`
            - `start.sh`：Linux 上 `chmod +x start.sh && ./start.sh` 即可，`PORT` / `HOST` 可覆盖；二进制是 musl 静态链接，不挑发行版

            **没有鉴权**：任何人 POST `/__auth/login` 都在用这台机器的网络出口登录统一认证，
            `/znzhxgpt/**` 同理。放公网前请套一层反向代理做访问控制。
          files: |
            out/padk-linux-x64
            out/padk-windows-x64.exe
            rust/start.sh
