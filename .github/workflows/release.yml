name: Release

# 打 tag 触发（v1.0.0 这种），也可以在 Actions 页面手动跑一次
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════════════════
  # 桌面端：Windows + macOS（Intel / Apple Silicon）
  #
  # macOS 必须跑在 macOS runner 上 —— Apple 的工具链不跨平台。
  # 产物未做代码签名（签名要 Apple 开发者账号，$99/年），
  # 用户首次打开需要右键「打开」，或者执行：
  #   xattr -d com.apple.quarantine /Applications/平安打卡.app
  # ══════════════════════════════════════════════════════════
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          # macOS 只占一个 runner，直接出 universal 二进制
          # （同时含 arm64 与 x64）。之前分两个 job 各占一个 macOS runner，
          # 在公共仓库里排队能排到天荒地老 —— macOS runner 本来就紧张。
          - os: macos-latest
            target: universal-apple-darwin
            label: macos-universal

    runs-on: ${{ matrix.os }}
    name: desktop / ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 05-padk-web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal 需要两个架构的 target 都在
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      # Rust 依赖编译很慢，缓存能省掉大半时间
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 05-padk-web/src-tauri

      - name: 安装前端依赖
        working-directory: 05-padk-web
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 05-padk-web
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: 平安打卡 ${{ github.ref_name }}
          releaseBody: |
            自动构建产物。

            - Windows：`平安打卡_*_x64-setup.exe`，直接安装
            - macOS：`.dmg`，**未签名**，首次打开请右键「打开」
              或执行 `xattr -d com.apple.quarantine /Applications/平安打卡.app`
          releaseDraft: true
          prerelease: false

      # tauri-action 只上传打包好的安装器（nsis / msi），
      # 但裸 exe 才是真正的免安装版：双击即跑，不写注册表、不进开始菜单。
      # 它一直在 target/release 里躺着，只是没人往上放。
      - name: 追加 Windows 便携版
        if: matrix.os == 'windows-latest' && github.ref_name != ''
        shell: bash
        working-directory: 05-padk-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/csu-padk.exe padk-portable-x64.exe
          gh release upload "${{ github.ref_name }}" padk-portable-x64.exe --clobber
          echo "已上传 padk-portable-x64.exe"

  # ══════════════════════════════════════════════════════════
  # Android APK
  #
  # 不需要任何开发者账号，允许「未知来源」即可安装。
  # Android 工程由 CI 现场初始化（tauri android init），
  # 所以本地不需要装 Android SDK / NDK。
  # ══════════════════════════════════════════════════════════
  android:
    runs-on: ubuntu-latest
    name: android / apk
    # Tauri CLI 生成的 Gradle 任务会在 gen/android 目录里执行 beforeBuildCommand
    # （npm run build），那里没有 package.json，因此在 CI 里必然失败。
    # 属于上游工具链的已知摩擦，先不阻塞桌面端发布。
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 05-padk-web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 05-padk-web/src-tauri

      - name: 安装前端依赖
        working-directory: 05-padk-web
        run: npm ci

      - name: 初始化 Android 工程
        working-directory: 05-padk-web
        run: npx tauri android init

      - name: 构建 APK
        working-directory: 05-padk-web
        run: npx tauri android build --apk

      - name: 收集产物
        run: |
          mkdir -p out
          find 05-padk-web/src-tauri/gen/android -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*.apk
          tag_name: ${{ github.ref_name }}

# ══════════════════════════════════════════════════════════════
# 关于 iOS
#
# Tauri 2 支持 iOS，但产物必须用 Apple 开发者账号签名才能装进真机
# （$99/年，没有正当的绕过方式）。未签名的构建只能跑模拟器。
# 所以这里不提供 iOS 产物 —— 零预算下它做不出可用的东西。
# ══════════════════════════════════════════════════════════════
